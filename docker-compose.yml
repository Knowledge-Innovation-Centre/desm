version: "3"
services:
  web:
    build: .
    ports:
      - "${EXTERNAL_PORT:-3030}:3030"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:17
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    command: redis-server
    volumes:
      - redis:/data

volumes:
  pg_data:
  redis:

