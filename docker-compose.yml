version: "3"
services:
  web:
    build:
      context: .
      args:
        - APP_DOMAIN=${APP_DOMAIN}
        - PRIVATE_KEY=${PRIVATE_KEY}
        - SECRET_KEY_BASE=${SECRET_KEY_BASE}
        - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    ports:
      - "${EXTERNAL_PORT:-3030}:3030"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3030/session_status" ]
      interval: 300s
      start_period: 30s
    depends_on:
      - redis
    env_file:
      - .env

  db:
    image: postgres:17
    profiles: [ withdb ]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    command: redis-server
    volumes:
      - redis:/data

volumes:
  pg_data:
  redis:

