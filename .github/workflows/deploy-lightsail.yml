# ------------------------------------------------------------------------------
# Lightsail Deployment Workflow
# ------------------------------------------------------------------------------
# This workflow handles the building, testing, and deployment to AWS Lightsail.
# ------------------------------------------------------------------------------
name: Deploy Backend to AWS Lightsail

on:
  push:
    branches:
      - production
  workflow_dispatch:
    # This enables manual triggering with no inputs required

jobs:
  build_and_deploy:
    name: Build and Deploy the application
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # ------------------------------------------------------------------------------
      # Setup Phase
      # ------------------------------------------------------------------------------
      #- name: Checkout code
      #  uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Restore cached Docker layers
        uses: actions/cache/restore@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ------------------------------------------------------------------------------
      # Build and Test Phase
      # ------------------------------------------------------------------------------
      - name: Build and test container
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: desm-kic:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: APP_DOMAIN=${{ vars.DESM_APP_DOMAIN }}

      # Move and save cache to avoid growing infinitely
      - name: Move Docker cache directory
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Cache Docker layers
        uses: actions/cache/save@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}

      - name: Create Docker network for testing
        run: docker network create desm-test

      - name: Run Postgres
        run: |
          docker run -d --name db \
            --network=desm-test \
            -e POSTGRES_DB=desm \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=47110815abcd0123 \
            -e POSTGRES_PORT=5432 \
            postgres:17

      - name: Run Redis
        run: |
          docker run -d --name redis \
            --network=desm-test \
            redis:7-alpine

      - name: Run backend container for testing
        run: |
          docker run -d --name desm-kic --network=desm-test -p 3030:3030 \
            -e APP_DOMAIN=http://localhost:3030 \
            -e PRIVATE_KEY=${{ secrets.DESM_PRIVATE_KEY }} \
            -e SECRET_KEY_BASE=${{ secrets.DESM_RAILS_MASTER_KEY }} \
            -e RAILS_MASTER_KEY=${{ secrets.DESM_RAILS_MASTER_KEY }} \
            -e POSTGRES_ADDRESS=db \
            -e POSTGRES_DB=desm \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=47110815abcd0123 \
            -e POSTGRES_PORT=5432 \
            -e REDIS_URL_CACHING=redis://redis:6379/0 \
            desm-kic:latest

      - name: Health check backend
        run: |
          # Verifies the container is running properly
          if ! timeout 300s bash -c 'until curl -f -s http://localhost:3030/session_status; do sleep 10; done'; then
            echo "❌ DESM failed to start! Fetching container logs..."
            docker logs --tail 30 backend-app
            exit 1
          fi
          echo "✅ Health check passed"

      # ------------------------------------------------------------------------------
      # Deployment Phase
      # ------------------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Lightsail Control Plugin
        run: |
          # Required for pushing container images to AWS Lightsail
          echo "Installing Lightsail Control Plugin..."
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl
          lightsailctl --version || echo "Plugin installed but version command not available"
          echo "Lightsail Control Plugin installed successfully"

      - name: Push to AWS Lightsail backend service
        run: |
          # Check AWS CLI version
          aws --version

          # Push the container image directly to AWS Lightsail
          aws lightsail push-container-image --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --label web --image desm-kic

          # Get the latest pushed image reference
          latest_image=$(aws lightsail get-container-images --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --query 'containerImages[0].image' --output text)

          # Create a new deployment with the latest image and all environment variables
          # This replaces the existing deployment with a new one using our updated container
          aws lightsail create-container-service-deployment \
            --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} \
            --containers '{
              "redis": {
                "image": "redis:7-alpine",
                "ports": {
                  "6379": "TCP"
                }
              },
              "web": {
                "image": "'$latest_image'",
                "ports": {
                  "3030": "HTTP"
                },
                "environment": {
                  "APP_DOMAIN": "${{ vars.DESM_APP_DOMAIN }}",
                  "PRIVATE_KEY": "${{ secrets.DESM_PRIVATE_KEY }}",
                  "SECRET_KEY_BASE": "${{ secrets.DESM_RAILS_MASTER_KEY }}",
                  "RAILS_MASTER_KEY": "${{ secrets.DESM_RAILS_MASTER_KEY }}",
                  "POSTGRES_ADDRESS": "${{ vars.POSTGRES_ADDRESS }}",
                  "POSTGRES_DB": "${{ vars.POSTGRES_DB }}",
                  "POSTGRES_USER": "${{ vars.POSTGRES_USER }}",
                  "POSTGRES_PASSWORD": "${{ secrets.POSTGRES_PASSWORD }}",
                  "REDIS_URL_CACHING": "redis://localhost:6379/0"
                }
              }
            }' \
            --public-endpoint '{"containerName":"web","containerPort":3030,"healthCheck":{"path":"/session_status"}}'

      # ------------------------------------------------------------------------------
      # Validation Phase
      # ------------------------------------------------------------------------------
      - name: Wait for deployment to complete
        run: |
          # Waits for the deployment to finish and the service to be in RUNNING state
          echo "Waiting for deployment to complete..."

          # Poll the service status until it's running
          if ! timeout 1200s bash -c 'until [[ "$(aws lightsail get-container-services --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --query \"containerServices[0].state\" --output text)" != "RUNNING" ]]; do sleep 20 ; done' ; then
            echo "❌ Deployment failed"
            exit 1
          fi
          echo "✅ Deployment complete"

      - name: Health check
        run: |
          # Performs a health check on the deployed service to ensure it's working correctly
          # Get the backend URL and ensure it's in the correct format
          BACKEND_URL=$(aws lightsail get-container-services --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --query 'containerServices[0].url' --output text)

          # Print raw URL as returned by AWS
          echo "Backend URL returned by AWS: '${BACKEND_URL}'"

          # Remove trailing slash if present
          BACKEND_URL=${BACKEND_URL%/}

          # Check the correct health endpoint
          HEALTH_URL="${BACKEND_URL}/session_status"
          echo "Checking health at: ${HEALTH_URL}"

          if timeout 300s bash -c "curl -v ${HEALTH_URL}"; then
            echo "✅ Health check passed"
            exit 0
          else
            echo "❌ Health check failed!"
            echo "Dumping service information for debugging:"
            aws lightsail get-container-services --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }}
            exit 1
          fi

      # ------------------------------------------------------------------------------
      # Cleanup Phase
      # ------------------------------------------------------------------------------
      - name: Cleanup old container images
        run: |
          # Removes old container images to avoid accumulating unnecessary storage
          # Keeps the 3 most recent images for rollback purposes
          echo "Cleaning up old container images, keeping only the 3 most recent..."

          # Get all container images sorted by creation date (newest first)
          all_images=$(aws lightsail get-container-images --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --query 'containerImages[*].image' --output json)

          # Parse the JSON and count total images
          echo "Current images: ${all_images}"
          total_images=$(echo "${all_images}" | jq length)
          echo "Total images count: ${total_images}"

          # If we have more than 3 images, delete the older ones
          if [ "${total_images}" -gt 3 ]; then
            # Calculate how many to delete
            delete_count=$((total_images - 3))
            echo "Will delete ${delete_count} old images"

            # Get the list of images to delete (all but the first 3)
            images_to_delete=$(echo "${all_images}" | jq '.[3:length]')

            # Process each image to delete
            for i in $(seq 0 $((delete_count - 1))); do
              image=$(echo "${images_to_delete}" | jq -r ".[$i]")
              echo "Deleting image: ${image}"

              # Register the image for deletion
              aws lightsail delete-container-image --service-name ${{ vars.AWS_LIGHTSAIL_SERVICE }} --image "${image}"

              echo "✅ Image ${image} has been registered for deletion"
            done

            echo "Image cleanup complete. Deleted ${delete_count} old images."
          else
            echo "Less than or equal to 3 images present. No cleanup needed."
          fi
